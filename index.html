<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iQOO GAMEBOY SIGNAL</title>
    <!-- Pixel 8-Bit Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #050507;
            --case-bg: #111116;
            --screen-bg: #090204;
            --red-main: #ff1e42;
            --red-glow: #ff4d6d;
            --red-dark: #3a000b;
            --text-white: #f0f0f0;
            --text-dim: #7a2b3a;
            --border-red: #6e0818;
            --green-win: #00ff66;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Press Start 2P', monospace;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            overflow: hidden;
        }

        /* ดีไซน์ทรง Game Boy สัดส่วนแนวตั้งสำหรับ Vivo iQOO 13 */
        .gameboy-device {
            width: 100%; max-width: 420px;
            height: 100vh; height: 100dvh;
            background: var(--case-bg);
            border-left: 2px solid #1f1f26; border-right: 2px solid #1f1f26;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 18px 14px 24px 14px;
            box-shadow: 0 0 35px rgba(255, 30, 66, 0.18);
            position: relative;
        }

        /* Top Header Bar & LED Status */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 8px; color: var(--red-glow); margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .led-container {
            display: flex; align-items: center; gap: 6px;
        }

        .led-status {
            width: 7px; height: 7px;
            background-color: var(--red-main);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--red-main);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* กรอบจอภาพ Retro Bezel */
        .screen-bezel {
            background: #140407;
            border: 3px solid var(--border-red);
            border-radius: 8px;
            padding: 10px;
            flex-grow: 1;
            display: flex; flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.95);
            position: relative;
        }

        /* หน้าจอสีส้มแดง Retro CRT */
        .screen {
            background: var(--screen-bg);
            border: 2px solid var(--red-dark);
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 9px;
            line-height: 1.8;
            position: relative;
        }

        /* เส้น CRT Scanline Effect */
        .screen::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.7;
        }

        .app-title {
            text-align: center; color: var(--red-glow);
            border-bottom: 2px dashed var(--red-dark);
            padding-bottom: 6px; margin-bottom: 10px;
            font-size: 9px;
            text-shadow: 0 0 6px var(--red-dark);
        }

        /* Signal Card สไตล์ Pixel */
        .signal-card {
            border: 2px solid var(--red-main);
            background: #160206;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: 3px 3px 0px var(--red-dark);
        }

        .card-header {
            display: flex; justify-content: space-between;
            color: var(--red-glow);
            border-bottom: 1px solid var(--red-dark);
            padding-bottom: 4px; margin-bottom: 8px;
        }

        .price-row {
            display: flex; justify-content: space-between;
            margin-bottom: 4px;
        }

        .timer-box {
            background: var(--red-dark);
            color: var(--text-white);
            padding: 5px; margin-top: 8px;
            text-align: center;
            font-size: 8px;
            border: 1px solid var(--red-main);
        }

        /* Controls Area (ปุ่มกด Pixel A/B) */
        .controls {
            margin-top: 12px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .button-row {
            display: flex; justify-content: space-between; gap: 8px;
        }

        .pixel-btn {
            background: #1f0308;
            color: var(--red-glow);
            border: 2px solid var(--red-main);
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--red-dark);
            text-align: center;
        }

        .pixel-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--red-dark);
        }

        .brand-footer {
            text-align: center; font-size: 7px;
            color: var(--text-dim); margin-top: 6px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="gameboy-device">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="led-container">
            <span class="led-status"></span>
            <span>POWER</span>
        </div>
        <span>iQOO 13 8-BIT</span>
    </div>

    <!-- Screen Bezel -->
    <div class="screen-bezel">
        <div class="screen">
            <div class="app-title">
                FOREX SIGNAL v1.0<br>
                [RR 1:3 ULTRA CONFIRM]
            </div>

            <!-- Tab 1: ACTIVE QUEST -->
            <div id="tab-active">
                <div style="color: var(--text-dim); margin-bottom: 6px;">> ACTIVE SIGNAL:</div>
                <div id="active-content">
                    <div style="color: #555; text-align: center; margin-top: 30px;">SEARCHING FOR CONFIRMED SIGNALS...</div>
                </div>
            </div>

            <!-- Tab 2: QUEST CLEARED -->
            <div id="tab-cleared" style="display: none;">
                <div style="color: var(--text-dim); margin-bottom: 6px;">> QUEST CLEARED:</div>
                <div id="cleared-content">
                    <div style="color: #555; text-align: center; margin-top: 30px;">NO COMPLETED TRADES YET.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Buttons Controller -->
    <div class="controls">
        <div class="button-row">
            <button class="pixel-btn" onclick="switchTab('active')">[A] ACTIVE</button>
            <button class="pixel-btn" onclick="switchTab('cleared')">[B] CLEARED</button>
        </div>
        <div class="brand-footer">GAME BOY RETRO - VIVO iQOO 13</div>
    </div>
</div>

<script>
    // Config Firebase
    const firebaseConfig = {
        databaseURL: "https://iqoo-signal-bot-default-rtdb.firebaseio.com" // <-- ใส่ URL ของคุณตรงนี้
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ฟังข้อมูล Realtime จาก Cloud
    db.ref('current_trade').on('value', (snapshot) => {
        const data = snapshot.val();
        const activeContainer = document.getElementById('active-content');
        
        if (data && data.status === 'RUNNING') {
            const isBuy = data.type === 'BUY';
            activeContainer.innerHTML = `
                <div class="signal-card">
                    <div class="card-header">
                        <span>${data.symbol}</span>
                        <span style="color: ${isBuy ? varCSS('--green-win') : varCSS('--red-main')}">${data.type}</span>
                    </div>
                    <div class="price-row"><span>- ENTRY :</span> <span>${data.entry}</span></div>
                    <div class="price-row"><span>- TP    :</span> <span>${data.tp}</span></div>
                    <div class="price-row"><span>- SL    :</span> <span>${data.sl}</span></div>
                    <div style="color: var(--red-glow); margin-top: 6px;">* TREND: ${data.trend} *</div>
                    <div class="timer-box">DURATION: <span id="trade-timer">00:00:00</span></div>
                </div>
            `;
            startTimer(data.opened_at || Date.now());
        } else {
            activeContainer.innerHTML = `<div style="color: #555; text-align: center; margin-top: 30px;">SEARCHING FOR CONFIRMED SIGNALS...</div>`;
        }
    });

    // โหลดประวัติออเดอร์ที่จบแล้ว
    db.ref('trade_history').limitToLast(5).on('value', (snapshot) => {
        const clearedContainer = document.getElementById('cleared-content');
        clearedContainer.innerHTML = '';
        snapshot.forEach((child) => {
            const item = child.val();
            const isWin = item.result === 'HIT TP';
            clearedContainer.innerHTML += `
                <div class="signal-card" style="border-color: #333; background: #0e0204;">
                    <div class="card-header">
                        <span>${item.symbol}</span>
                        <span style="color: ${isWin ? '#00ff66' : '#ff1e42'}">[${item.result}]</span>
                    </div>
                    <div class="price-row"><span>ENTRY :</span> <span>${item.entry}</span></div>
                    <div class="price-row"><span>CLOSED:</span> <span>${item.close_price}</span></div>
                    <div style="color: var(--text-dim); margin-top: 4px;">TIME: ${item.duration}</div>
                </div>
            `;
        });
    });

    function varCSS(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function switchTab(tab) {
        document.getElementById('tab-active').style.display = tab === 'active' ? 'block' : 'none';
        document.getElementById('tab-cleared').style.display = tab === 'cleared' ? 'block' : 'none';
    }

    let intervalId;
    function startTimer(startTime) {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            let h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            let m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            let s = String(elapsed % 60).padStart(2, '0');
            const timerElem = document.getElementById('trade-timer');
            if (timerElem) timerElem.innerText = `${h}:${m}:${s}`;
        }, 1000);
    }
</script>

</body>
</html>
