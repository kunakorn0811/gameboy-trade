<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GAMEBOY SIGNAL TRADER - iQOO 13 EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #030305;
            color: #ff2a4b;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปรับสัดส่วนรองรับหน้าจอ 20:9 ของ Vivo iQOO 13 */
        .gameboy-device {
            width: 100vw;
            height: 100dvh;
            max-width: 440px;
            max-height: 950px;
            background: linear-gradient(155deg, #1d1d24 0%, #101014 100%);
            border-radius: 16px 16px 40px 16px;
            border: 3px solid #2a2a35;
            box-shadow: 0 0 40px rgba(255, 0, 60, 0.25);
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 24px;
        }

        .brand-logo {
            color: #ff003c;
            font-size: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 60, 0.6);
        }

        .power-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .power-led {
            width: 9px;
            height: 9px;
            background-color: #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff003c;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; box-shadow: 0 0 14px #ff003c; }
        }

        .power-text {
            font-size: 6px;
            color: #777;
        }

        /* กรอบจอขยายให้ยาวขึ้นตามทรง 20:9 */
        .screen-bezel {
            background-color: #09090d;
            border: 2px solid #252530;
            border-radius: 10px;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.95);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin: 8px 0;
        }

        .bezel-header {
            color: #444;
            font-size: 6px;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .screen {
            background: #060002;
            border: 2px solid #3a000e;
            border-radius: 6px;
            flex-grow: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(255, 0, 60, 0.15);
        }

        .screen::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.8;
        }

        .symbol-title {
            font-size: 11px;
            color: #ffffff;
            text-shadow: 0 0 6px #ff003c;
            text-align: center;
            border-bottom: 1px dashed #ff003c;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .signal-badge {
            text-align: center;
            font-size: 16px;
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #ff003c;
            background: rgba(255, 0, 60, 0.15);
            color: #ff3355;
            text-shadow: 0 0 10px #ff003c;
            letter-spacing: 2px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            margin: 8px 0;
            color: #ffa1b2;
        }

        .data-value {
            color: #ffffff;
            text-shadow: 0 0 4px #ff003c;
        }

        .tp-val { color: #00ffaa; text-shadow: 0 0 5px #00ffaa; }
        .sl-val { color: #ff3355; text-shadow: 0 0 5px #ff3355; }

        .trend-tag {
            font-size: 7px;
            color: #ffcc00;
            text-align: center;
            margin-top: 6px;
        }

        .screen-footer {
            border-top: 1px dashed #44111d;
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 7px;
            color: #ff7788;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px 6px;
        }

        .dpad-and-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dpad {
            width: 96px;
            height: 96px;
            position: relative;
        }

        .dpad-btn {
            background-color: #121215;
            border: 2px solid #22222a;
            position: absolute;
            cursor: pointer;
        }

        .dpad-btn:active { background-color: #ff003c; }

        .dpad-up { top: 0; left: 32px; width: 32px; height: 34px; border-radius: 4px 4px 0 0; }
        .dpad-down { bottom: 0; left: 32px; width: 32px; height: 34px; border-radius: 0 0 4px 4px; }
        .dpad-left { top: 32px; left: 0; width: 34px; height: 32px; border-radius: 4px 0 0 4px; }
        .dpad-right { top: 32px; right: 0; width: 34px; height: 32px; border-radius: 0 4px 4px 0; }
        .dpad-center { top: 32px; left: 32px; width: 32px; height: 32px; background: #18181c; }

        .action-buttons {
            display: flex;
            gap: 16px;
            transform: rotate(-12deg);
        }

        .btn-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-round {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #ff003c, #a00025);
            border: 2px solid #ff5e7e;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(255, 0, 60, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-round:active {
            transform: scale(0.92);
            background: #ff003c;
        }

        .btn-label { font-size: 7px; color: #777; }

        .meta-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 4px;
        }

        .pill-btn-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .pill-btn {
            width: 42px;
            height: 12px;
            background-color: #22222b;
            border-radius: 10px;
            transform: rotate(-25deg);
            border: 1px solid #333;
        }

        .pill-btn-wrap:active .pill-btn { background-color: #ff003c; }
        .pill-label { font-size: 7px; color: #555; transform: rotate(-25deg); }
    </style>
</head>
<body>

<div class="gameboy-device">
    <div class="top-bar">
        <div class="brand-logo">GAME BOY <span style="color:#fff;">iQOO</span></div>
        <div class="power-container">
            <div class="power-led"></div>
            <div class="power-text">POWER</div>
        </div>
    </div>

    <div class="screen-bezel">
        <div class="bezel-header">DOT MATRIX WITH STEREO SOUND</div>
        
        <div class="screen">
            <div>
                <div class="symbol-title" id="symbol">XAUUSD / GOLD</div>
                <div class="signal-badge" id="type">WAITING...</div>
                
                <div class="data-row">
                    <span>ENTRY:</span>
                    <span class="data-value" id="entry">0.00</span>
                </div>
                <div class="data-row">
                    <span>TP (RR 1:3):</span>
                    <span class="data-value tp-val" id="tp">0.00</span>
                </div>
                <div class="data-row">
                    <span>SL:</span>
                    <span class="data-value sl-val" id="sl">0.00</span>
                </div>
                
                <div class="trend-tag" id="trend">* WAITING FOR SIGNAL *</div>
            </div>

            <div class="screen-footer">
                <span id="status">STATUS: RUNNING</span>
                <span id="time">00:00:00</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="dpad-and-buttons">
            <div class="dpad">
                <div class="dpad-btn dpad-up" onclick="playSound(500)"></div>
                <div class="dpad-btn dpad-left" onclick="playSound(450)"></div>
                <div class="dpad-btn dpad-center"></div>
                <div class="dpad-btn dpad-right" onclick="playSound(550)"></div>
                <div class="dpad-btn dpad-down" onclick="playSound(400)"></div>
            </div>

            <div class="action-buttons">
                <div class="btn-holder" onclick="btnB_Clear()">
                    <div class="btn-round">B</div>
                    <div class="btn-label">CLEAR</div>
                </div>
                <div class="btn-holder" onclick="btnA_Live()">
                    <div class="btn-round">A</div>
                    <div class="btn-label">LIVE</div>
                </div>
            </div>
        </div>

        <div class="meta-buttons">
            <div class="pill-btn-wrap" onclick="btnSelect()">
                <div class="pill-btn"></div>
                <div class="pill-label">SELECT</div>
            </div>
            <div class="pill-btn-wrap" onclick="btnStart()">
                <div class="pill-btn"></div>
                <div class="pill-label">START</div>
            </div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://iqoo-signal-bot-default-rtdb.firebaseio.com/current_trade.json";
    let isAutoSync = true;
    let audioCtx = null;
    let lastOpenedAt = 0;

    function playSound(freq = 440, type = 'square', duration = 0.08) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('time').innerText = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchSignal() {
        if (!isAutoSync) return;
        try {
            const res = await fetch(FIREBASE_URL);
            if (!res.ok) return;
            const data = await res.json();

            if (data) {
                if (data.opened_at && data.opened_at !== lastOpenedAt) {
                    lastOpenedAt = data.opened_at;
                    playSound(880, 'square', 0.1);
                    setTimeout(() => playSound(1046, 'square', 0.1), 120);
                    setTimeout(() => playSound(1318, 'square', 0.2), 240);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
                }

                document.getElementById('symbol').innerText = data.symbol || 'XAUUSD / GOLD';
                document.getElementById('type').innerText = data.type || 'WAITING...';
                document.getElementById('entry').innerText = data.entry || '0.00';
                document.getElementById('tp').innerText = data.tp || '0.00';
                document.getElementById('sl').innerText = data.sl || '0.00';
                document.getElementById('trend').innerText = data.trend || '* WAITING *';
                document.getElementById('status').innerText = `STATUS: ${data.status || 'RUNNING'}`;

                const typeElem = document.getElementById('type');
                if (data.type === 'BUY') {
                    typeElem.style.borderColor = '#00ffaa';
                    typeElem.style.color = '#00ffaa';
                    typeElem.style.background = 'rgba(0, 255, 170, 0.15)';
                    typeElem.style.textShadow = '0 0 10px #00ffaa';
                } else if (data.type === 'SELL') {
                    typeElem.style.borderColor = '#ff003c';
                    typeElem.style.color = '#ff3355';
                    typeElem.style.background = 'rgba(255, 0, 60, 0.15)';
                    typeElem.style.textShadow = '0 0 10px #ff003c';
                }
            }
        } catch (e) {}
    }

    function btnA_Live() {
        playSound(880, 'square', 0.1);
        fetchSignal();
    }

    function btnB_Clear() {
        playSound(300, 'sawtooth', 0.12);
        document.getElementById('type').innerText = "CLEARED";
        document.getElementById('type').style.borderColor = "#555";
        document.getElementById('type').style.color = "#888";
        document.getElementById('entry').innerText = "0.00";
        document.getElementById('tp').innerText = "0.00";
        document.getElementById('sl').innerText = "0.00";
    }

    function btnSelect() {
        playSound(600, 'triangle', 0.08);
        const symbolElem = document.getElementById('symbol');
        symbolElem.innerText = symbolElem.innerText.includes('XAUUSD') ? 'EURUSD' : 'XAUUSD / GOLD';
    }

    function btnStart() {
        playSound(700, 'square', 0.15);
        isAutoSync = !isAutoSync;
        document.getElementById('status').innerText = isAutoSync ? "STATUS: RUNNING" : "STATUS: PAUSED";
    }

    setInterval(fetchSignal, 3000);
    fetchSignal();
</script>

</body>
</html>
